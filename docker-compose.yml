services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pumangol
      POSTGRES_PASSWORD: pumangol
      POSTGRES_DB: pumangol
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumangol -d pumangol"]
      interval: 5s
      timeout: 5s
      retries: 20

  pumangol_auth:
    image: postgres:16
    container_name: pumangol_auth
    environment:
      POSTGRES_USER: pumangol
      POSTGRES_PASSWORD: pumangol
      POSTGRES_DB: pumangol_auth
    ports:
      - "5434:5432"
    volumes:
      - pumangol_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumangol -d pumangol_auth"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  pumangol_auth_data:
